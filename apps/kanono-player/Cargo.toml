[package]
name = "kanono-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
iced.workspace = true
image.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
rfd.workspace = true
tokio.workspace = true
kanono-audio-engine = { path = "../../crates/audio-engine" }
kanono-plugin-api = { path = "../../crates/plugin-api" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", features = ["blocking"] }
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
single-instance = "0.3.3"
zbus.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
